# Daily music import: finds new albums/EPs, enriches them and recalculates the
# recommendations - all on the server, in MariaDB. This workflow only starts
# it: it calls the protected import endpoint repeatedly (each call does ~20 s
# of work, within one.com's PHP time limits) until the server reports "done".
# No commits, no deploys, no data in the repository.
#
# Needs the secret IMPORT_TOKEN (the same value the deploy writes to the
# server). Scheduled runs need the repository variable IMPORT_ENABLED=true.
name: Daily import

on:
  schedule:
    # GitHub often starts scheduled runs hours late (or skips one), so the
    # import is started three times a night: the first run that gets through
    # does the work, later ones find nothing due and finish in seconds.
    - cron: '17 23,1,3 * * *'   # 00:17, 02:17, 04:17 Danish time (01:17, 03:17, 05:17 in summer)
  workflow_dispatch:

concurrency:
  group: daily-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Up to three attempts, one after the other, each on its own runner: if the
  # server cannot be reached at all from one runner (DNS/TCP/TLS failed before
  # a request was sent - some runner addresses get no answer from the host),
  # the next attempt gets a new machine and usually a new address. Any other
  # error (HTTP, PHP, the import itself) fails at once, as before. The import
  # continues from its stored state, so a repeated call is always safe.
  import:
    # Scheduled runs only when switched on (repository variable IMPORT_ENABLED=true);
    # a manual run (workflow_dispatch) always works.
    if: github.event_name == 'workflow_dispatch' || vars.IMPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      retry: ${{ steps.run.outputs.retry }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Run the import on the server
        id: run
        env:
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://musik.hornpedersen.dk' }}
        run: bash scripts/import-job.sh

  import-new-runner-2:
    needs: import
    if: needs.import.outputs.retry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      retry: ${{ steps.run.outputs.retry }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Run the import on the server (attempt 2, new runner)
        id: run
        env:
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://musik.hornpedersen.dk' }}
        run: bash scripts/import-job.sh

  import-new-runner-3:
    needs: import-new-runner-2
    if: needs.import-new-runner-2.outputs.retry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Run the import on the server (attempt 3, last)
        env:
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://musik.hornpedersen.dk' }}
          LAST_ATTEMPT: 'true'
        run: bash scripts/import-job.sh
