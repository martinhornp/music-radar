# Local development environment. Not used in production (one.com).
#   docker compose up -d   ->  API on http://localhost:8080/api
services:
  php:
    build: ./docker/php
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Mirrors the one.com web root: built frontend at /, API at /api.
      - ./frontend/dist:/var/www/html
      - ./api:/var/www/api
    environment:
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-music_radar}
      DB_USER: ${DB_USER:-music_radar}
      DB_PASSWORD: ${DB_PASSWORD:-music_radar}
      # Local token for the internal import endpoints (from .env, git-ignored)
      IMPORT_TOKEN: ${IMPORT_TOKEN:-}
    depends_on:
      - db

  db:
    image: mariadb:11
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME:-music_radar}
      MARIADB_USER: ${DB_USER:-music_radar}
      MARIADB_PASSWORD: ${DB_PASSWORD:-music_radar}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
